name: Marketplace verify watch

# Watches the marketplace verification request for a plugin release and
# announces the moment it is verified.
#
# The marketplace (plugins.omarchy.org) lists a plugin against ONE exact
# commit; a newer release stays "Update unverified" until that commit is
# verified and promoted. The request lives as an issue on the marketplace
# repo, and a maintainer's approved-and-verified decision closes it.
#
# This workflow polls that issue and, the first time it sees the
# approved-and-verified label, opens a tracking issue in THIS repo — the
# announcement is the notification (GitHub watch → email). It then stops
# doing work: the tracking issue's existence is the "already announced"
# marker, so every later run exits early.
#
# A request that asks for changes (needs-fixes) or that closes without
# approval is announced too, so a stalled verification never fails
# silently.
#
# Reads go through the REST API with curl (not the gh wrapper) so a
# wrapper's stdout can never be mistaken for payload.

on:
  schedule:
    # every 30 minutes, off the :00/:30 marks
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Marketplace issue number to watch'
        required: false
        default: '12226'

permissions:
  contents: read
  issues: write

concurrency:
  group: marketplace-verify-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch the marketplace verify request
    runs-on: ubuntu-latest
    steps:
      - name: Watch for the verified snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKETPLACE_REPO: omacom/omarchy-plugin-marketplace
          ISSUE_NUMBER: ${{ inputs.issue || '12226' }}
          PLUGIN_ID: io.github.glasschan.appimage
          PLUGIN_VERSION: 0.6.9
          TARGET_COMMIT: 69e08656e14f4cfdd1e4e72a0536c1629b6808b8
          ANNOUNCEMENT_TITLE: '[Marketplace] AppImage for Omarchy v0.6.9 — snapshot verified'
          FIXES_TITLE: '[Marketplace] AppImage for Omarchy v0.6.9 — verification needs fixes'
          STALLED_TITLE: '[Marketplace] AppImage for Omarchy v0.6.9 — verify request closed without approval'
        run: |
          set -euo pipefail

          api_get() {
            curl -sSL --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          announced() {
            api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
              | jq -r --arg t "$1" '.[].title | select(. == $t)' \
              | grep -q .
          }

          if announced "$ANNOUNCEMENT_TITLE" \
             || announced "$STALLED_TITLE" \
             || announced "$FIXES_TITLE"; then
            echo "already announced — nothing to do"
            exit 0
          fi

          issue_json="$(api_get "https://api.github.com/repos/$MARKETPLACE_REPO/issues/$ISSUE_NUMBER")"
          issue_url="$(printf '%s' "$issue_json" | jq -r '.html_url')"
          issue_state="$(printf '%s' "$issue_json" | jq -r '.state')"
          issue_labels="$(printf '%s' "$issue_json" | jq -r '[.labels[].name] | join(", ")')"
          issue_title="$(printf '%s' "$issue_json" | jq -r '.title')"
          has_label() {
            printf '%s' "$issue_json" | jq -r '.labels[].name' | grep -qx "$1"
          }

          echo "marketplace issue: $issue_title ($issue_state) [$issue_labels]"

          if has_label "approved-and-verified"; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ANNOUNCEMENT_TITLE" \
              --body "The marketplace verification request for **$PLUGIN_ID v$PLUGIN_VERSION** is verified.

          - **Marketplace request:** $issue_url
          - **Target commit:** \`$TARGET_COMMIT\`
          - **Plugin id:** \`$PLUGIN_ID\`
          - **Labels on the request:** $issue_labels

          The listing now points at this exact commit. Nothing further is needed for the release; the plugin ships through \`omarchy plugin update\`."
          elif has_label "needs-fixes"; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$FIXES_TITLE" \
              --body "The marketplace asked for changes on the verification request for **$PLUGIN_ID v$PLUGIN_VERSION**.

          - **Marketplace request:** $issue_url
          - **Target commit:** \`$TARGET_COMMIT\`
          - **Labels on the request:** $issue_labels

          The automated validation or the security baseline flagged something. The validation report is the first comment on the request."
          elif [ "$issue_state" = "closed" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$STALLED_TITLE" \
              --body "The marketplace verification request for **$PLUGIN_ID v$PLUGIN_VERSION** was closed without the \`approved-and-verified\` label.

          - **Marketplace request:** $issue_url
          - **Target commit:** \`$TARGET_COMMIT\`
          - **Labels on the request:** ${issue_labels:-none}

          The listing was NOT promoted to this commit — the marketplace page still shows the previous snapshot as verified and this release as unverified. A new verification request is needed."
          else
            echo "still pending (labels: $issue_labels) — no announcement"
          fi
