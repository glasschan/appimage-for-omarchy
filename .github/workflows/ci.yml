# CI for "AppImage for Omarchy".
#
# Lean by design (PRD §2): three quick jobs on stock runners — no Omarchy,
# no Quickshell. They cover exactly what the project itself accepts:
#   backend          — the stdlib-only unittest suite (Python 3.14,
#                      matches the dev machine; ResourceWarnings are errors)
#   frontend-js      — lib/*.js parser harness on Node
#   plugin-manifest  — manifest/repo hygiene + the PRD §2 < 1MB size budget
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (python 3.14, stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Unit tests (ResourceWarnings as errors)
        run: python3 -W error::ResourceWarning -m unittest discover -s backend/tests -v

  frontend-js:
    name: Frontend JS parse harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: lib/*.js parse harness
        run: node tests-js/parse-harness.mjs

  plugin-manifest:
    name: Manifest, hygiene & size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest and repo hygiene
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys

          errors = []

          # manifest.json is valid JSON and carries the required keys.
          with open('manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          for key in ('schemaVersion', 'id', 'name', 'version', 'kinds', 'entryPoints'):
              if key not in manifest:
                  errors.append(f'manifest.json: missing required key {key!r}')

          # Every entryPoint is an existing relative path with exact filename case.
          for role, rel in manifest.get('entryPoints', {}).items():
              if os.path.isabs(rel) or '..' in rel.split('/'):
                  errors.append(f'entryPoints.{role}: {rel!r} must be a relative path inside the repo')
                  continue
              if not os.path.isfile(rel):
                  errors.append(f'entryPoints.{role}: {rel!r} does not exist')
                  continue
              parent, base = os.path.split(rel)
              if base not in os.listdir(parent or '.'):
                  errors.append(f'entryPoints.{role}: {rel!r} filename case does not match the file on disk')

          # Plugin id: exact and not in the reserved omarchy.* namespace.
          plugin_id = manifest.get('id', '')
          if plugin_id != 'io.github.glasschan.appimage':
              errors.append(f'manifest id: expected io.github.glasschan.appimage, got {plugin_id!r}')
          if plugin_id.startswith('omarchy.'):
              errors.append(f'manifest id: {plugin_id!r} must not use the reserved omarchy.* prefix')

          # No symlinks anywhere in the checkout.
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for name in list(dirs) + files:
                  path = os.path.join(root, name)
                  if os.path.islink(path):
                      errors.append(f'symlink in repo: {path}')

          # No bytecode or __pycache__ tracked.
          tracked = subprocess.run(
              ['git', 'ls-files'], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          for path in tracked:
              if '__pycache__' in path.split('/') or path.endswith('.pyc'):
                  errors.append(f'bytecode tracked in git: {path}')

          # Every backend .py carries the GPL-3.0 attribution header.
          for root, dirs, files in os.walk('backend'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for name in files:
                  if not name.endswith('.py'):
                      continue
                  path = os.path.join(root, name)
                  with open(path, encoding='utf-8') as f:
                      head = f.read(512)
                  if 'GPL-3.0' not in head:
                      errors.append(f'{path}: missing GPL-3.0 attribution header')

          # License files are present.
          for path in ('LICENSE', 'icons/LICENSE-TABLER.md'):
              if not os.path.isfile(path):
                  errors.append(f'missing required file: {path}')

          if errors:
              print('\n'.join(f'- {e}' for e in errors))
              sys.exit(1)
          print('manifest and hygiene checks passed')
          EOF

      - name: Runtime size budget (< 1MB, PRD §2)
        run: |
          python3 - <<'EOF'
          import os, sys

          # Runtime whitelist — must stay in sync with install.sh's copy set.
          paths = ['manifest.json', 'README.md', 'LICENSE', 'backend/main.py']
          paths += [n for n in os.listdir('.') if n.endswith('.qml') and os.path.isfile(n)]
          for d in ('lib', 'icons', 'backend/omarchy_appimage'):
              for root, dirs, files in os.walk(d):
                  dirs[:] = [x for x in dirs if x != '__pycache__']
                  paths += [os.path.join(root, f) for f in files]

          total = 0
          for p in paths:
              if not os.path.isfile(p):
                  print(f'whitelist entry missing from checkout: {p}')
                  sys.exit(1)
              total += os.path.getsize(p)

          budget = 1024 * 1024
          print(f'runtime size: {total} bytes ({total / 1024:.0f} KiB), budget: {budget} bytes')
          if total >= budget:
              print('SIZE BUDGET EXCEEDED (PRD §2: plugin body < 1MB)')
              sys.exit(1)
          print('size budget OK')
          EOF
